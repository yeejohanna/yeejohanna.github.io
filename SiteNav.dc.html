<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
[data-nav-work-left]{display:none;}
@media (max-width:640px){
  [data-site-nav]{padding:20px!important;}
  [data-nav-work-left]{display:inline;}
  [data-nav-work-right]{display:none;}
}
</style>
</helmet>
<div style="position:relative;z-index:60">
  <nav data-site-nav style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:26px 32px;max-width:var(--shell,960px);width:100%;margin:0 auto">
    <div style="display:flex;align-items:center;gap:24px;flex:1 1 0;min-width:0">
      <a data-nav-work-left href="{{ workHref }}" onClick="{{ goWork }}" style="font-size:15px;font-weight:500;color:var(--accent)">Work</a>
    </div>
    <a href="/" aria-label="Jojo, home" style="width:42px;height:42px;display:grid;place-items:center;flex-shrink:0" style-hover="opacity:1">
      <img src="{{ logoSrc }}" alt="Jojo logo" style="width:100%;height:100%;object-fit:contain;transition:transform .7s cubic-bezier(.34,1.2,.4,1)" style-hover="transform:rotate(360deg)">
    </a>
    <div style="display:flex;align-items:center;justify-content:flex-end;gap:18px;flex:1 1 0;min-width:0">
      <a data-nav-work-right href="{{ workHref }}" onClick="{{ goWork }}" style="font-size:15px;font-weight:500;color:var(--accent)">Work</a>
      <a href="about" style="font-size:15px;font-weight:500;color:var(--accent)">About</a>
      <button onClick="{{ toggleTheme }}" aria-label="Toggle dark mode" title="Toggle dark mode" style="width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--cream);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0;font-size:13px;line-height:1;transition:transform .25s ease,border-color .25s ease" style-hover="transform:rotate(-24deg) scale(1.06);border-color:var(--accent)">{{ themeGlyph }}</button>
    </div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:96}}">
class Component extends DCLogic {
  state = { dark: false };

  componentDidMount() {
    let stored = null;
    try { stored = localStorage.getItem('jy-theme'); } catch (e) {}
    const dark = stored ? stored === 'dark' : false;
    this.applyTheme(dark);
    this.setState({ dark });

    // logo-spin page transition on internal navigation
    this.onClick = (e) => {
      const a = e.target.closest && e.target.closest('a');
      if (!a) return;
      const href = a.getAttribute('href') || '';
      if (!href || href.startsWith('#') || href.startsWith('mailto:') || a.target === '_blank') return;
      if (/^https?:/i.test(href)) return;
      if (a.hasAttribute('download')) return;
      if (/\.(?!html?$)[a-z0-9]+$/i.test(href.split(/[?#]/)[0])) return;
      e.preventDefault();
      this.showVeil();
      setTimeout(() => { window.location.href = href; }, 340);
    };
    document.addEventListener('click', this.onClick);

    this.fadeInVeil();
  }

  componentWillUnmount() { document.removeEventListener('click', this.onClick); }

  veil() {
    let v = document.getElementById('jy-veil');
    if (!v) {
      v = document.createElement('div');
      v.id = 'jy-veil';
      v.style.cssText = 'position:fixed;inset:0;z-index:900;display:grid;place-items:center;background:var(--paper);opacity:0;pointer-events:none;transition:opacity .3s ease';
      const img = document.createElement('img');
      img.src = 'assets/jojo-logo.png';
      img.alt = '';
      img.style.cssText = 'width:46px;height:46px;object-fit:contain;animation:spin 1.1s linear infinite';
      v.appendChild(img);
      document.body.appendChild(v);
    }
    return v;
  }

  showVeil() {
    const v = this.veil();
    v.style.pointerEvents = 'all';
    v.style.opacity = '1';
  }

  fadeInVeil() {
    const v = this.veil();
    v.style.transition = 'none';
    v.style.opacity = '1';
    v.style.pointerEvents = 'all';
    requestAnimationFrame(() => {
      v.style.transition = 'opacity .45s ease';
      v.style.opacity = '0';
      v.style.pointerEvents = 'none';
    });
  }

  applyTheme(dark) {
    document.body.setAttribute('data-theme', dark ? 'dark' : 'light');
    try { localStorage.setItem('jy-theme', dark ? 'dark' : 'light'); } catch (e) {}
  }

  renderVals() {
    return {
      workHref: document.getElementById('work') || location.pathname === '/' ? '#work' : '/#work',
      goWork: (e) => {
        const el = document.getElementById('work');
        if (!el) return;
        e.preventDefault();
        e.stopPropagation();
        if (e.nativeEvent && e.nativeEvent.stopImmediatePropagation) e.nativeEvent.stopImmediatePropagation();
        window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY, behavior: 'smooth' });
        history.replaceState(null, '', '#work');
      },
      themeGlyph: this.state.dark ? '☾' : '☀',
      logoSrc: this.state.dark ? 'assets/jojo-logo-white.png' : 'assets/jojo-logo.png',
      toggleTheme: () => {
        const dark = !this.state.dark;
        this.applyTheme(dark);
        this.setState({ dark });
      }
    };
  }
}
</script>
</body>
</html>
